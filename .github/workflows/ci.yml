name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine is embedded in hosts we don't control: keep it portable.
        lua: ["5.1", "5.2", "5.3", "5.4", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v5
        with:
          # >= 3.12 is required: older LuaRocks on LuaJIT/5.1 cannot load the
          # luarocks.org manifest ("main function has more than 65536 constants").
          luaRocksVersion: "3.13.0"
      - run: luarocks install busted
      - run: busted

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1"
      - uses: leafo/gh-actions-luarocks@v5
        with:
          # >= 3.12 is required: older LuaRocks on LuaJIT/5.1 cannot load the
          # luarocks.org manifest ("main function has more than 65536 constants").
          luaRocksVersion: "3.13.0"
      - run: luarocks install luacheck
      - run: luacheck src spec examples
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check src spec examples
